add_item:
  name: Lägg till vara i inköpslista
  description: Lägger till en ny vara i en Coop-inköpslista.
  fields:
    name:
      name: Varunamn
      description: Namn på varan som ska läggas till.
      required: true
      example: "Mjölk 1.5L"
      selector:
        text:
    quantity:
      name: Kvantitet
      description: Antal eller mängd.
      required: false
      default: "1"
      example: "2"
      selector:
        text:
    unit:
      name: Enhet
      description: Måttenhet som stöds av Coop (st, kg, g, l, dl, pkt).
      required: false
      example: "st"
      selector:
        select:
          options:
            - "st"
            - "kg"
            - "g"
            - "l"
            - "dl"
            - "pkt"
          custom_value: true
    placement:
      name: Avdelning/placering
      description: Butiksplacering eller avdelning i butiken.
      required: false
      example: "Mejeri"
      selector:
        select:
          options:
            - "Alkohol"
            - "Bakning · Efterrätter · Frukost"
            - "Barn · Baby"
            - "Bröd"
            - "Djupfryst"
            - "Drycker"
            - "Erbjudanden"
            - "Frukt och grönt"
            - "Godis · Snacks"
            - "Huvudingrediens"
            - "Hygien"
            - "Konserver · Skafferi"
            - "Kryddor · Smaksättare"
            - "Mejeri"
            - "Mos · Pasta · Ris"
            - "Städa · Tvätta · Diska"
            - "Övrigt"
          custom_value: true
    list_id:
      name: Inköpsliste-ID
      description: ID för inköpslistan. Om tomt används första tillgängliga lista.
      required: false
      example: "3051572"
      selector:
        text:
    entry_id:
      name: Integrations-ID
      description: Home Assistant config entry ID (valfritt vid enbart ett konto).
      required: false
      selector:
        text:

update_item:
  name: Uppdatera vara i inköpslista
  description: Uppdaterar status (avbockad), namn, mängd eller placering för en befintlig vara.
  fields:
    product_id:
      name: Produkt-ID
      description: Unikt ID för produkten i inköpslistan.
      required: true
      example: "123456"
      selector:
        text:
    is_checked:
      name: Avbockad
      description: Sätt till sant för att bocka av varan, falskt för att avmarkera.
      required: false
      selector:
        boolean:
    name:
      name: Nytt varunamn
      description: Uppdaterat namn på varan.
      required: false
      example: "Ekologisk Mjölk"
      selector:
        text:
    quantity:
      name: Kvantitet
      description: Uppdaterad kvantitet.
      required: false
      example: "3"
      selector:
        text:
    unit:
      name: Enhet
      description: Uppdaterad enhet (st, kg, g, l, dl, pkt).
      required: false
      example: "st"
      selector:
        select:
          options:
            - "st"
            - "kg"
            - "g"
            - "l"
            - "dl"
            - "pkt"
          custom_value: true
    placement:
      name: Placering
      description: Uppdaterad avdelning i butiken.
      required: false
      selector:
        select:
          options:
            - "Alkohol"
            - "Bakning · Efterrätter · Frukost"
            - "Barn · Baby"
            - "Bröd"
            - "Djupfryst"
            - "Drycker"
            - "Erbjudanden"
            - "Frukt och grönt"
            - "Godis · Snacks"
            - "Huvudingrediens"
            - "Hygien"
            - "Konserver · Skafferi"
            - "Kryddor · Smaksättare"
            - "Mejeri"
            - "Mos · Pasta · Ris"
            - "Städa · Tvätta · Diska"
            - "Övrigt"
          custom_value: true
    list_id:
      name: Inköpsliste-ID
      description: ID för listan. Kan utelämnas om produkten kan lokaliseras automatiskt.
      required: false
      selector:
        text:
    entry_id:
      name: Integrations-ID
      description: Config entry ID (valfritt).
      required: false
      selector:
        text:

delete_item:
  name: Ta bort vara från inköpslista
  description: Raderar en vara från Coop-inköpslistan.
  fields:
    product_id:
      name: Produkt-ID
      description: Unikt ID för produkten som ska tas bort.
      required: true
      example: "123456"
      selector:
        text:
    list_id:
      name: Inköpsliste-ID
      description: ID för listan. Kan utelämnas om produkten hittas automatiskt.
      required: false
      selector:
        text:
    entry_id:
      name: Integrations-ID
      description: Config entry ID (valfritt).
      required: false
      selector:
        text:

